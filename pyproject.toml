[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mithra"
version = "0.1.0"
description = "Personal Life OS — voice-first agentic orchestration layer"
requires-python = ">=3.12"
dependencies = [
    # API gateway
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",

    # Agent framework
    "langgraph>=0.1",
    "langchain-core>=0.2",

    # LLM
    "anthropic>=0.28",
    "openai>=1.30",   # used by LiteLLM for local model calls

    # Storage
    "cryptography>=42",
    "requests>=2.31",
    "httpx>=0.27",

    # Vector DB
    "chromadb>=0.5",

    # Google Calendar
    "google-auth>=2.29",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.128",

    # Messaging
    "python-telegram-bot>=21",
    "pywebpush>=1.14",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mithra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
