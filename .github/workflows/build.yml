name: Build and push Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

      - name: Run unit tests
        run: pytest tests/unit/ -x -q

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (api-gateway)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (llm-router)
        id: meta-llm
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-llm-router
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push llm-router
        uses: docker/build-push-action@v5
        with:
          context: ./services/litellm
          push: true
          tags: ${{ steps.meta-llm.outputs.tags }}
          labels: ${{ steps.meta-llm.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (ollama)
        id: meta-ollama
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ollama
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push ollama
        uses: docker/build-push-action@v5
        with:
          context: ./services/ollama
          push: true
          tags: ${{ steps.meta-ollama.outputs.tags }}
          labels: ${{ steps.meta-ollama.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
