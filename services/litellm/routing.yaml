model_list:
  - model_name: ollama/phi3:mini
    litellm_params:
      model: ollama/phi3:mini
      api_base: http://ollama:11434

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

# Automatic fallback chain: Gemini → GPT-4o-mini → Claude.
# Gemini free tier exhausted → GPT-4o-mini (cheap) → Claude (paid credits).
# Health domain (ollama/phi3:mini) has no fallbacks — architecture requirement.
router_settings:
  fallbacks:
    - {"gemini-flash": ["gpt-4o-mini", "claude-sonnet-4-6"]}
    - {"gpt-4o-mini": ["claude-sonnet-4-6"]}
  num_retries: 0

litellm_settings:
  drop_params: true
  request_timeout: 120
