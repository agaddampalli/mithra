model_list:
  - model_name: ollama/phi3-mini
    litellm_params:
      model: ollama/phi3:mini
      api_base: http://ollama:11434

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 30
