# Autonomy configuration — loaded at startup by AutononomyEngine.
# deadline_days: how many days ahead to consider a deadline "upcoming"
# default_level: 0=OBSERVE 1=SURFACE 2=ACT_TELL 3=ACT_SILENT

default_level: 1   # SURFACE — ask before every action

deadline_windows:
  health: 7
  food: 3
  money_bills: 14
  vehicles: 60
  documents: 90
  legal: 90
  environment: 2
  people: 21
  home: 30
  goals: 7
  default: 14

# Per-domain autonomy level overrides (optional).
# Uncomment and set to override the default for a specific domain.
# domain_overrides:
#   food: 2        # ACT_TELL — just do it and tell me
#   health: 1      # SURFACE — always ask for health actions

# NEVER list — hardcoded in autonomy/engine.py.
# Listed here for documentation only; editing this file does NOT change enforcement.
never_actions:
  - send_health_data_to_cloud
