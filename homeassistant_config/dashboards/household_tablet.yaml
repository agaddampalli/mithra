          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_routine_slot_4
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_routine_slot_4') }}"
              icon: mdi:repeat
              icon_color: "#0f6e56"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_routine_button_4

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_routine_slot_5
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_routine_slot_5') }}"
              icon: mdi:repeat
