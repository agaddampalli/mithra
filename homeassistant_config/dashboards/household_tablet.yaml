# Household tablet dashboard — wall-mounted kiosk view
# Tier 1: summary tiles (Tasks, Calendar, Routines)
# Tier 2: tap-to-complete slot buttons (5 tasks, 5 routines)
#
# v1 limitation: fixed 5 slots per domain. Empty slots show blank.
# Sensors defined in configuration.yaml template: block.

title: Household
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # ── Tier 1: Summary grid ───────────────────────────────────────────────
      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.mithra_tasks_summary
            name: Tasks
            icon: mdi:checkbox-marked-circle-outline

          - type: entity
            entity: sensor.mithra_calendar_summary
            name: Calendar
            icon: mdi:calendar

          - type: entity
            entity: sensor.mithra_routines
            name: Routines
            icon: mdi:repeat

      # ── Tier 2: Task slots ────────────────────────────────────────────────
      # Button entity_ids pinned via default_entity_id in configuration.yaml.
      # Button name template shows real task title once REST sensor polls;
      # falls back to "Task Slot N" at cold boot — entity_id is stable either way.
      - type: entities
        title: Tasks — tap to complete
        entities:
          - entity: button.mithra_task_button_1
          - entity: button.mithra_task_button_2
          - entity: button.mithra_task_button_3
          - entity: button.mithra_task_button_4
          - entity: button.mithra_task_button_5

      # ── Tier 2: Routine slots ─────────────────────────────────────────────
      - type: entities
        title: Routines — tap to mark done
        entities:
          - entity: button.mithra_routine_button_1
          - entity: button.mithra_routine_button_2
          - entity: button.mithra_routine_button_3
          - entity: button.mithra_routine_button_4
          - entity: button.mithra_routine_button_5
