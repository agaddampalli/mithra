# Household tablet dashboard — wall-mounted kiosk view
# Tier 1: summary tiles (Tasks, Calendar, Routines)
# Tier 2: tap-to-complete slot buttons (5 tasks, 5 routines)
#
# v1 limitation: fixed 5 slots per domain. Empty slots show blank.
# Sensors defined in configuration.yaml template: block.

title: Household
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # ── Tier 1: Summary grid ───────────────────────────────────────────────
      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.mithra_tasks_summary
            name: Tasks
            icon: mdi:checkbox-marked-circle-outline

          - type: entity
            entity: sensor.mithra_calendar_summary
            name: Calendar
            icon: mdi:calendar

          - type: entity
            entity: sensor.mithra_routines
            name: Routines
            icon: mdi:repeat

      # ── Tier 2: Task slots ────────────────────────────────────────────────
      # Button name is templated at backend level (configuration.yaml
      # template: button: name: >-) — shows task title AND is tappable.
      # entity_ids derived from fallback name slug "Task Slot N":
      # verify against Developer Tools → States after registry clear + restart.
      - type: entities
        title: Tasks — tap to complete
        entities:
          - entity: button.task_slot_1
          - entity: button.task_slot_2
          - entity: button.task_slot_3
          - entity: button.task_slot_4
          - entity: button.task_slot_5

      # ── Tier 2: Routine slots ─────────────────────────────────────────────
      # entity_ids derived from fallback name slug "Routine Slot N":
      # verify against Developer Tools → States after registry clear + restart.
      - type: entities
        title: Routines — tap to mark done
        entities:
          - entity: button.routine_slot_1
          - entity: button.routine_slot_2
          - entity: button.routine_slot_3
          - entity: button.routine_slot_4
          - entity: button.routine_slot_5
