# Household tablet dashboard — wall-mounted kiosk view (UI-04/UI-15/UI-07/UI-08)
# Path A navigation: HA's native sidebar, Mushroom content cards.
# ADR §17 visual pass: pastel color coding, urgency banner, weather.
#
# Color scheme (icon_color only — card_mod not yet verified installed):
#   Tasks:    icon_color "#993c1d" (terracotta)
#   Routines: icon_color "#0f6e56" (dark teal)
#   Calendar: icon_color "#534ab7" (medium purple)
#   Urgent:   icon_color "#c0392b" (alert red)
#   Background colors (#faece7/#e1f5ee/#eeedfe) require card_mod:
#     - Verify: find homeassistant_config/www -name "*card-mod*"
#     - If installed, add card_mod: style blocks per each card
#
# Urgency banner: condition uses 'overdue' in summary string.
#   Summary format confirmed from domain.py:
#     "N urgent · N overdue · N/M routines done"   (parts joined by " · ")
#     "All clear today! 🎉"                         (when nothing pending)
#   The word "overdue" appears literally — lower() match is safe.
#
# WEATHER_ENTITY_ID: replace with actual entity_id from HA Developer
#   Tools → States after Open-Meteo integration is added (Part 1).
#   Do NOT deploy with this placeholder in place.
#
# tap_action: "perform-action"/"perform_action" is HA 2024.8+ syntax.
# Empty slots: conditional state_not: "" hides rows (UI-15).
# Layout: vertical-stack per section prevents masonry column scatter.

title: Household
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # ── URGENCY BANNER — only renders when any task is overdue ────────────
      # Confirmed: domain.py appends "N overdue" to summary when overdue_count > 0.
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {{ 'overdue' in states('sensor.mithra_tasks_summary') | lower }}
        card:
          type: custom:mushroom-template-card
          primary: "{{ states('sensor.mithra_tasks_summary') }}"
          secondary: "Tap a task below to complete it"
          icon: mdi:alert-circle
          icon_color: "#c0392b"

      # ── Tier 1: summary glance row ────────────────────────────────────────
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.mithra_tasks_summary').split('·')[0].strip() }}
            secondary: "Tasks"
            icon: mdi:checkbox-marked-outline
            icon_color: "#993c1d"

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.mithra_calendar_summary') }}"
            secondary: "Calendar"
            icon: mdi:calendar-clock
            icon_color: "#534ab7"

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.mithra_routines') }}"
            secondary: "Routines"
            icon: mdi:repeat
            icon_color: "#0f6e56"

      # ── Weather — Open-Meteo real data ────────────────────────────────────
      # Replace WEATHER_ENTITY_ID with entity confirmed in Part 1.
      - type: weather-forecast
        entity: WEATHER_ENTITY_ID
        forecast_type: daily
        show_current: true
        show_forecast: false

      # ── Today's tasks ─────────────────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: heading
            heading: "Today's tasks"
            heading_style: subtitle

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_task_slot_1
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_task_slot_1') }}"
              icon: mdi:flag
              icon_color: "#993c1d"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_task_button_1

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_task_slot_2
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_task_slot_2') }}"
              icon: mdi:flag
              icon_color: "#993c1d"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_task_button_2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_task_slot_3
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_task_slot_3') }}"
              icon: mdi:flag
              icon_color: "#993c1d"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_task_button_3

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_task_slot_4
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_task_slot_4') }}"
              icon: mdi:flag
              icon_color: "#993c1d"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_task_button_4

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_task_slot_5
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_task_slot_5') }}"
              icon: mdi:flag
              icon_color: "#993c1d"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_task_button_5

      # ── Today's routines ──────────────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: heading
            heading: "Today's routines"
            heading_style: subtitle

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_routine_slot_1
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_routine_slot_1') }}"
              icon: mdi:repeat
              icon_color: "#0f6e56"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_routine_button_1

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_routine_slot_2
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_routine_slot_2') }}"
              icon: mdi:repeat
              icon_color: "#0f6e56"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.mithra_routine_button_2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.mithra_routine_slot_3
                state_not: ""
            card:
              type: custom:mushroom-template-card
              primary: "{{ states('sensor.mithra_routine_slot_3') }}"
              icon: mdi:repeat
              icon_color: "#0f6e56"
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
