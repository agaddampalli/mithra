# Household tablet dashboard — wall-mounted kiosk view
# Tier 1: summary tiles (Tasks, Calendar, Routines)
# Tier 2: tap-to-complete slot buttons (5 tasks, 5 routines)
#
# v1 limitation: fixed 5 slots per domain. Empty slots show blank.
# Sensors defined in configuration.yaml template: block.

title: Household
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # ── Tier 1: Summary grid ───────────────────────────────────────────────
      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.mithra_tasks_summary
            name: Tasks
            icon: mdi:checkbox-marked-circle-outline

          - type: entity
            entity: sensor.mithra_calendar_summary
            name: Calendar
            icon: mdi:calendar

          - type: entity
            entity: sensor.mithra_routines
            name: Routines
            icon: mdi:repeat

      # ── Tier 2: Task slots ────────────────────────────────────────────────
      # Sensor entity shows its own state (the task title) natively.
      # tap_action calls the backend template button which holds the guard +
      # REST command with correct task_id — frontend card Jinja is not evaluated.
      - type: entities
        title: Tasks — tap to complete
        entities:
          - entity: sensor.mithra_task_slot_1
            icon: mdi:checkbox-blank-circle-outline
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_task_slot_1

          - entity: sensor.mithra_task_slot_2
            icon: mdi:checkbox-blank-circle-outline
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_task_slot_2

          - entity: sensor.mithra_task_slot_3
            icon: mdi:checkbox-blank-circle-outline
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_task_slot_3

          - entity: sensor.mithra_task_slot_4
            icon: mdi:checkbox-blank-circle-outline
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_task_slot_4

          - entity: sensor.mithra_task_slot_5
            icon: mdi:checkbox-blank-circle-outline
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_task_slot_5

      # ── Tier 2: Routine slots ─────────────────────────────────────────────
      - type: entities
        title: Routines — tap to mark done
        entities:
          - entity: sensor.mithra_routine_slot_1
            icon: mdi:repeat
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_routine_slot_1

          - entity: sensor.mithra_routine_slot_2
            icon: mdi:repeat
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_routine_slot_2

          - entity: sensor.mithra_routine_slot_3
            icon: mdi:repeat
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_routine_slot_3

          - entity: sensor.mithra_routine_slot_4
            icon: mdi:repeat
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_routine_slot_4

          - entity: sensor.mithra_routine_slot_5
            icon: mdi:repeat
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.complete_routine_slot_5
