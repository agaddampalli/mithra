# Home Assistant configuration for Mithra household
# No secrets or tokens in this file — it is git-tracked.
# Cloudflare Access credentials belong in .env (never committed).

default_config:

# ── Reverse-proxy trust ──────────────────────────────────────────────────────
# cloudflared sits in front of HA on home.mithra-app.com (ADR 16.5).
# The Docker bridge subnet (172.18.0.0/16) is the trusted proxy range.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.18.0.0/16

# ── Lovelace YAML mode ───────────────────────────────────────────────────────
# mode: yaml disables UI editing; all cards are defined in dashboard files.
lovelace:
  resource_mode: yaml
  resources:
    - url: /local/community/lovelace-mushroom/mushroom.js
      type: module
    - url: /local/community/ha-dashboard-sidebar/ha-dashboard-sidebar.js
      type: module
  dashboards:
    household-tablet:
      mode: yaml
      title: Household
      filename: dashboards/household_tablet.yaml
      show_in_sidebar: true
      require_admin: false
    # ── UI-01 TEST DASHBOARDS (delete after investigation) ────────────────────
    test-tasks:
      mode: yaml
      title: Tasks
      icon: mdi:checkbox-marked-outline
      filename: dashboards/test_tasks.yaml
      show_in_sidebar: true
    test-routines:
      mode: yaml
      title: Routines
      icon: mdi:repeat
      filename: dashboards/test_routines.yaml
      show_in_sidebar: true
    test-calendar:
      mode: yaml
      title: Calendar
      icon: mdi:calendar
      filename: dashboards/test_calendar.yaml
      show_in_sidebar: true

# ── REST sensors — poll Mithra api-gateway via internal Docker DNS ───────────
# HA REST sensors NEVER use the public Cloudflare hostname (ADR 16.5).
# The api-gateway container is reachable at http://api-gateway:8000/ on
# the shared mithra-net Docker network.
rest:
  - resource: http://api-gateway:8000/api/v1/dashboard
    scan_interval: 300
    sensor:
      - name: Mithra Dashboard
        unique_id: mithra_dashboard
        value_template: "{{ value_json.scope }}"
        json_attributes:
          - domains
          - errors

  - resource: http://api-gateway:8000/api/v1/routines/today
    scan_interval: 60
    sensor:
      - name: Mithra Routines
        unique_id: mithra_routines
        value_template: "{{ value_json.done_count }}/{{ value_json.total }}"
        json_attributes:
          - routines

# ── REST commands — HA tablet tap → Mithra api-gateway ──────────────────────
rest_command:
  mithra_complete_task:
    url: "http://api-gateway:8000/api/v1/tasks/{{ task_id }}/complete"
    method: post
    content_type: "application/json"
    payload: "{}"

  mithra_complete_routine:
    url: "http://api-gateway:8000/api/v1/routines/{{ routine_id }}/complete"
    method: post
    content_type: "application/json"
    payload: "{}"

# ── Template sensors — derive per-domain summaries and slot data ─────────────
template:
  - sensor:
    # ── Tier 1: domain summary sensors ──────────────────────────────────────
    # | default([]) only catches undefined, not None — use explicit is not none guard.
    - name: Mithra Tasks Summary
      unique_id: mithra_tasks_summary
      state: >-
        {% set doms = state_attr('sensor.mithra_dashboard', 'domains') %}
        {% set doms = doms if doms is not none else [] %}
        {% set d = doms | selectattr('domain', 'equalto', 'tasks') | list | first | default({}) %}
        {{ d.get('summary', 'unavailable') if d else 'unavailable' }}

    - name: Mithra Calendar Summary
      unique_id: mithra_calendar_summary
      state: >-
        {% set doms = state_attr('sensor.mithra_dashboard', 'domains') %}
        {% set doms = doms if doms is not none else [] %}
        {% set d = doms | selectattr('domain', 'equalto', 'time') | list | first | default({}) %}
        {{ d.get('summary', 'unavailable') if d else 'unavailable' }}

    # ── Tier 2: task slot sensors (fixed 5 slots) ────────────────────────────
